# =============================================================================
# Service 4: Payments API — Kubernetes Manifests
# Deployment + ClusterIP Service
# Accessible internally at: http://service-4-payments-api.k8s.api.internal
# Accessible publicly at: http://NGINX_PUBLIC_IP.nip.io/api/payments
# =============================================================================

---
# Deployment: runs the payments API container in GKE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-4-payments-api-deployment
  labels:
    app: service-4-payments-api
    tier: backend
    location: gke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-4-payments-api
  template:
    metadata:
      labels:
        app: service-4-payments-api
        tier: backend
        location: gke
    spec:
      containers:
        - name: service-4-payments-api
          image: us-central1-docker.pkg.dev/secure-devops-setup/prod-repo/service-4-payments-api:latest
          ports:
            - containerPort: 3002
          env:
            # Internal ALB DNS — service-5 is Cloud Run, reached via *.api.internal → ALB IP
            - name: NOTIFICATIONS_CLOUDRUN_URL
              value: "http://service-5-notifications-cloudrun.api.internal"
            - name: PORT
              value: "3002"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
# ClusterIP Service: exposes the payments API pod inside the cluster
# Also used as the backend for the internal Nginx Ingress
# so Cloud Run (Service 5) can call back to this service
apiVersion: v1
kind: Service
metadata:
  name: service-4-payments-api-cluster-ip
  labels:
    app: service-4-payments-api
spec:
  type: ClusterIP
  selector:
    app: service-4-payments-api
  ports:
    - port: 80
      targetPort: 3002
      protocol: TCP
